<title>growthGrid</title>
<style>
  /* Motion runs once, when the file loads. With reduced motion, or in a
   renderer without CSS animation (social cards, icons), it doesn't run and
   this file is simply the finished logo: nothing is hidden by default. */
  @media (prefers-reduced-motion: no-preference) {
    #mark > * { transform-box: fill-box; transform-origin: 50% 50%; animation: gg-pulse .7s cubic-bezier(.45, 0, .2, 1) both }
    #mark > :nth-child(2) { animation-delay: 0.08s }
    #mark > :nth-child(3) { animation-delay: 0.08s }
    #mark > :nth-child(4) { animation-delay: 0.16s }
    #mark > :nth-child(5) { animation-delay: 0.16s }
    #mark > :nth-child(6) { animation-delay: 0.24s }
    #mark > :nth-child(7) { animation-delay: 0.24s }
    #mark > .leaf { transform-origin: 0 100%; animation: gg-nod .9s cubic-bezier(.45, 0, .2, 1) 0.34s both }
  }
  @keyframes gg-pulse { 45% { opacity: .55; transform: scale(.84) } }
  @keyframes gg-nod { 45% { transform: rotate(-7deg) scale(.85) } }
</style>
