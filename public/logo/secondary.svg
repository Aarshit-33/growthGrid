<title>growthGrid</title>
<style>
  /* Motion runs once, when the file loads. With reduced motion, or in a
   renderer without CSS animation (social cards, icons), it doesn't run and
   this file is simply the finished logo: nothing is hidden by default. */
  @media (prefers-reduced-motion: no-preference) {
    #mark > * { transform-box: fill-box; transform-origin: 50% 100%; animation: gg-tile .6s cubic-bezier(.22, 1, .36, 1) both }
    #mark > :nth-child(2) { animation-delay: 0.09s }
    #mark > :nth-child(3) { animation-delay: 0.13s }
    #mark > :nth-child(4) { animation-delay: 0.18s }
    #mark > :nth-child(5) { animation-delay: 0.22s }
    #mark > :nth-child(6) { animation-delay: 0.27s }
    #mark > :nth-child(7) { animation-delay: 0.31s }
    #mark > .leaf { transform-origin: 0 100%; animation: gg-sprout .9s cubic-bezier(.2, .9, .25, 1) 0.36s both }
    #wordmark path { animation: gg-rise .8s cubic-bezier(.16, 1, .3, 1) both }
    #growth > :nth-child(1) { animation-delay: 0.28s }
    #growth > :nth-child(2) { animation-delay: 0.315s }
    #growth > :nth-child(3) { animation-delay: 0.35s }
    #growth > :nth-child(4) { animation-delay: 0.385s }
    #growth > :nth-child(5) { animation-delay: 0.42s }
    #growth > :nth-child(6) { animation-delay: 0.455s }
    #grid > :nth-child(1) { animation-delay: 0.49s }
    #grid > :nth-child(2) { animation-delay: 0.525s }
    #grid > :nth-child(3) { animation-delay: 0.56s }
    #grid > :nth-child(4) { animation-delay: 0.595s }
  }
  @keyframes gg-tile { from { opacity: 0; transform: scale(.4) } }
  @keyframes gg-sprout { from { opacity: 0; transform: rotate(-40deg) scale(0) } }
  @keyframes gg-rise { from { opacity: 0; transform: translateY(60px) } }
</style>
